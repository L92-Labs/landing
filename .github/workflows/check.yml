name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm -r typecheck
      - name: Cloudflare-only dependency allowlist
        run: bash .github/scripts/cloudflare-only.sh
